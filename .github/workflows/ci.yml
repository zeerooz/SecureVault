name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A later push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        working-directory: backend
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Audit dependencies
        working-directory: backend
        # A known-vulnerable package in a security project is a contradiction,
        # so this fails the build rather than printing a warning.
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.log
          if grep -q "has the following vulnerable packages" audit.log; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/results.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f backend/src/SecureVault.Api/Dockerfile -t securevault-api:ci backend

      - name: Build web image
        run: docker build -t securevault-web:ci frontend

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Start the stack
        run: |
          echo "JWT_SIGNING_KEY=$(openssl rand -base64 48)" > .env
          docker compose up -d --build

      - name: Wait for the API
        # nginx proxies /health through to the API, so one URL covers both.
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Seed and verify the demo vault
        # Proves the whole chain end to end: client-side key derivation,
        # registration, encryption, storage and read-back through the real API.
        run: node tools/seed-demo.mjs --api http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
