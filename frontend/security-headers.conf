# Security headers.
#
# This file is included in every location block that declares an add_header of
# its own. That repetition is required, not sloppiness: nginx's add_header is
# not additive across levels — a single add_header inside a location DISCARDS
# every add_header inherited from the server block. Declaring these once at the
# server level silently drops the CSP on exactly the pages that set their own
# cache headers, which is the page that matters most here.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.pwnedpasswords.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
